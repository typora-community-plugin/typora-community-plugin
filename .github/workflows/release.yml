name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=critical

      - name: Audit (advisory)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm run lint

      - name: i18n key alignment
        run: pnpm run check:i18n

      - name: Typecheck
        run: pnpm --filter ./packages/core run typecheck

      - name: Test
        run: pnpm --recursive --if-present test

      - name: Build declarations
        run: pnpm --filter ./packages/core run build-dts

      - run: pnpm run build

      - name: Extract changelog
        run: |
          tag="${{ github.ref_name }}"
          awk -v ver="v$tag" '
            $0 ~ "^## " ver " *$" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' docs/en-us/user-guide/CHANGELOG.md > release_body.md
          [ -s release_body.md ] || echo "# $tag" > release_body.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --notes-file release_body.md
          --verify-tag
          typora-community-plugin.zip
