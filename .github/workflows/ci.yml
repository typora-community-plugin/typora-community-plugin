name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: i18n key alignment
        run: pnpm run check:i18n

      - name: Typecheck
        run: pnpm --filter ./packages/core run typecheck

      - name: Test
        run: pnpm --recursive --if-present test
